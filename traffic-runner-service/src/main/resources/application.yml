server:
  port: 8086

spring:
  application:
    name: traffic-runner-service
  datasource:
    url: jdbc:mysql://localhost:3306/castrel?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: castrel
    password: castrel
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379

services:
  order-url: http://localhost:8084
  inventory-url: http://localhost:8083

observability:
  enabled: true
  otlp-transport: http
  otlp-endpoint: http://localhost:4318/v1/traces

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: ${observability.enabled:true}
  tracing:
    enabled: ${observability.enabled:true}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${observability.otlp-endpoint}
      transport: ${observability.otlp-transport:http}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql:3306/castrel?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  data:
    redis:
      host: redis

observability:
  otlp-endpoint: http://tempo:4318/v1/traces

services:
  order-url: http://order-service:8084
  inventory-url: http://inventory-service:8083
