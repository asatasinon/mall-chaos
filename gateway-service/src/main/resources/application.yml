server:
  port: 8080

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: orders
              uri: ${ORDER_SERVICE_URL:http://localhost:18084}
              predicates:
                - Path=/api/orders/**
            - id: products
              uri: ${CATALOG_SERVICE_URL:http://localhost:18082}
              predicates:
                - Path=/api/products/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
