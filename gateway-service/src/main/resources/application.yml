server:
  port: 8080

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/internal/**]':
            allowedOriginPatterns: "*"
            allowedMethods: GET, POST, PUT, PATCH, DELETE, OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
      routes:
        - id: promotion-customer-coupons
          uri: ${PROMOTION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/me/coupons,/api/me/coupons/**
        - id: cart
          uri: ${CART_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/cart/**
        - id: user-auth
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: user-addresses
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/me/addresses/**
        - id: user-profile
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/me
        - id: payment-intents
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/orders/*/payment-intents
        - id: report-order-query
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/reports/order-query
        - id: orders
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/orders/**
        - id: checkout
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/checkout
        - id: payments
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/payments/**
        - id: notifications
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/notifications/**
        - id: fulfillments
          uri: ${FULFILLMENT_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/orders/*/shipment/**
        - id: report-product-browse
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/reports/product-browse
        - id: products
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/products/**

scenario-dispatch:
  dispatch:
    services:
      catalog-service: ${CATALOG_SERVICE_URL:http://localhost:8082}
      cart-service: ${CART_SERVICE_URL:http://localhost:8091}
      order-service: ${ORDER_SERVICE_URL:http://localhost:8084}
      promotion-service: ${PROMOTION_SERVICE_URL:http://localhost:8087}
      inventory-service: ${INVENTORY_SERVICE_URL:http://localhost:8083}
      notification-service: ${NOTIFICATION_SERVICE_URL:http://localhost:8090}
      psp-simulator: ${PSP_SIMULATOR_URL:http://localhost:8092}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
