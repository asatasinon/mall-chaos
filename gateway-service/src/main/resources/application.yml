server:
  port: 8080

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/internal/**]':
            allowedOriginPatterns: "*"
            allowedMethods: GET, POST, PUT, PATCH, DELETE, OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
      routes:
        - id: promotion-customer-coupons
          uri: ${PROMOTION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/me/coupons,/api/me/coupons/**
        - id: cart
          uri: ${CART_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/cart/**
        - id: user-auth
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: user-addresses
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/me/addresses/**
        - id: user-profile
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/me
        - id: payment-intents
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/orders/*/payment-intents
        - id: orders
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/orders/**
        - id: checkout
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/checkout
        - id: payments
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/payments/**
        - id: notifications
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/notifications/**
        - id: fulfillments
          uri: ${FULFILLMENT_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/orders/*/shipment/**
        - id: products
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/products/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true

# ── Chaos dispatch: service name → base URL mapping ──
chaos:
  endpoints:
    enabled: false
  dispatch:
    services:
      catalog-service: ${CHAOS_CATALOG_URL:${CATALOG_SERVICE_URL:http://localhost:8082}}
      inventory-service: ${CHAOS_INVENTORY_URL:${INVENTORY_SERVICE_URL:http://localhost:8083}}
      order-service: ${CHAOS_ORDER_URL:${ORDER_SERVICE_URL:http://localhost:8084}}
      payment-service: ${CHAOS_PAYMENT_URL:${PAYMENT_SERVICE_URL:http://localhost:8085}}
      promotion-service: ${CHAOS_PROMOTION_URL:${PROMOTION_SERVICE_URL:http://localhost:8087}}
      risk-service: ${CHAOS_RISK_URL:${RISK_SERVICE_URL:http://localhost:8088}}
      fulfillment-service: ${CHAOS_FULFILLMENT_URL:${FULFILLMENT_SERVICE_URL:http://localhost:8089}}
      notification-service: ${CHAOS_NOTIFICATION_URL:${NOTIFICATION_SERVICE_URL:http://localhost:8090}}
    # Which services support which chaos type
    whitelist:
      slow-sql:
        - catalog-service
        - inventory-service
        - order-service
        - payment-service
        - promotion-service
        - risk-service
        - fulfillment-service
        - notification-service
      memory-leak:
        - order-service
        - payment-service
      deadlock:
        - order-service
        - payment-service
      table-lock:
        - order-service
        - payment-service
        - fulfillment-service
        - notification-service
      storage-growth:
        - catalog-service
        - risk-service
        - notification-service
  toxiproxy:
    api-url: ${TOXIPROXY_API_URL:http://localhost:18474}
    proxy-whitelist:
      - order-to-payment
      - order-to-inventory
      - gateway-to-order
