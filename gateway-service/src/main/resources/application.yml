server:
  port: 8080

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: orders
              uri: ${ORDER_SERVICE_URL:http://localhost:18084}
              predicates:
                - Path=/api/orders/**
            - id: products
              uri: ${CATALOG_SERVICE_URL:http://localhost:18082}
              predicates:
                - Path=/api/products/**
            - id: chaos-order
              uri: ${CHAOS_ORDER_URL:${ORDER_SERVICE_URL:http://localhost:18084}}
              predicates:
                - Path=/ops/chaos/order/**
              filters:
                - RewritePath=/ops/chaos/order/?(?<segment>.*), /$\{segment}
            - id: chaos-payment
              uri: ${CHAOS_PAYMENT_URL:http://localhost:18085}
              predicates:
                - Path=/ops/chaos/payment/**
              filters:
                - RewritePath=/ops/chaos/payment/?(?<segment>.*), /$\{segment}
            - id: chaos-catalog
              uri: ${CHAOS_CATALOG_URL:${CATALOG_SERVICE_URL:http://localhost:18082}}
              predicates:
                - Path=/ops/chaos/catalog/**
              filters:
                - RewritePath=/ops/chaos/catalog/?(?<segment>.*), /$\{segment}
            - id: chaos-inventory
              uri: ${CHAOS_INVENTORY_URL:http://localhost:18083}
              predicates:
                - Path=/ops/chaos/inventory/**
              filters:
                - RewritePath=/ops/chaos/inventory/?(?<segment>.*), /$\{segment}
            - id: chaos-promotion
              uri: ${CHAOS_PROMOTION_URL:http://localhost:18087}
              predicates:
                - Path=/ops/chaos/promotion/**
              filters:
                - RewritePath=/ops/chaos/promotion/?(?<segment>.*), /$\{segment}
            - id: chaos-risk
              uri: ${CHAOS_RISK_URL:http://localhost:18088}
              predicates:
                - Path=/ops/chaos/risk/**
              filters:
                - RewritePath=/ops/chaos/risk/?(?<segment>.*), /$\{segment}
            - id: chaos-fulfillment
              uri: ${CHAOS_FULFILLMENT_URL:http://localhost:18089}
              predicates:
                - Path=/ops/chaos/fulfillment/**
              filters:
                - RewritePath=/ops/chaos/fulfillment/?(?<segment>.*), /$\{segment}
            - id: chaos-notification
              uri: ${CHAOS_NOTIFICATION_URL:http://localhost:18090}
              predicates:
                - Path=/ops/chaos/notification/**
              filters:
                - RewritePath=/ops/chaos/notification/?(?<segment>.*), /$\{segment}
            - id: toxiproxy-api
              uri: ${TOXIPROXY_API_URL:http://localhost:18474}
              predicates:
                - Path=/ops/toxiproxy/**
              filters:
                - RewritePath=/ops/toxiproxy/?(?<segment>.*), /$\{segment}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
