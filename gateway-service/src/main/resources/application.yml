server:
  port: 8080

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: orders
              uri: http://localhost:8084
              predicates:
                - Path=/api/orders/**
            - id: products
              uri: http://localhost:8082
              predicates:
                - Path=/api/products/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: orders
              uri: http://toxiproxy:18084
              predicates:
                - Path=/api/orders/**
            - id: products
              uri: http://catalog-service:8082
              predicates:
                - Path=/api/products/**
