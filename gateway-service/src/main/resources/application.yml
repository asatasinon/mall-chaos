server:
  port: 8080

chaos:
  endpoints:
    enabled: false

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13306/castrel?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:castrel}
    password: ${SPRING_DATASOURCE_PASSWORD:castrel}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/internal/**]':
            allowedOriginPatterns: "*"
            allowedMethods: GET, POST, PUT, PATCH, DELETE, OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
      routes:
        - id: orders
          uri: ${ORDER_SERVICE_URL:http://localhost:18084}
          predicates:
            - Path=/api/orders/**
        - id: products
          uri: ${CATALOG_SERVICE_URL:http://localhost:18082}
          predicates:
            - Path=/api/products/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true

# ── Chaos dispatch: service name → base URL mapping ──
chaos:
  dispatch:
    services:
      catalog-service: ${CATALOG_SERVICE_URL:http://localhost:18082}
      inventory-service: ${INVENTORY_SERVICE_URL:http://localhost:18083}
      order-service: ${ORDER_SERVICE_URL:http://localhost:18084}
      payment-service: ${PAYMENT_SERVICE_URL:http://localhost:18085}
      promotion-service: ${PROMOTION_SERVICE_URL:http://localhost:18087}
      risk-service: ${RISK_SERVICE_URL:http://localhost:18088}
      fulfillment-service: ${FULFILLMENT_SERVICE_URL:http://localhost:18089}
      notification-service: ${NOTIFICATION_SERVICE_URL:http://localhost:18090}
    # Which services support which chaos type
    whitelist:
      slow-sql:
        - catalog-service
        - inventory-service
        - order-service
        - payment-service
        - promotion-service
        - risk-service
        - fulfillment-service
        - notification-service
      memory-leak:
        - order-service
        - payment-service
      deadlock:
        - order-service
        - payment-service
      table-lock:
        - order-service
        - payment-service
        - fulfillment-service
        - notification-service
  toxiproxy:
    api-url: ${TOXIPROXY_API_URL:http://localhost:18474}
    proxy-whitelist:
      - order-service-proxy
      - payment-service-proxy
      - catalog-service-proxy
      - inventory-service-proxy
      - promotion-service-proxy
      - risk-service-proxy
      - fulfillment-service-proxy
      - notification-service-proxy
