server:
  port: 8084

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13306/castrel?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:castrel}
    password: ${SPRING_DATASOURCE_PASSWORD:castrel}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:16379}

services:
  user-url: ${USER_SERVICE_URL:http://localhost:18081}
  catalog-url: ${CATALOG_SERVICE_URL:http://localhost:18082}
  inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:18083}
  payment-url: ${PAYMENT_SERVICE_URL:http://localhost:18085}
  risk-url: ${RISK_SERVICE_URL:http://localhost:18088}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,schemaVersion
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
