server:
  port: 8084

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13306/castrel?useSSL=false&serverTimezone=Asia/Shanghai&connectionTimeZone=%2B08:00&allowPublicKeyRetrieval=true&connectTimeout=60000&socketTimeout=60000}
    username: ${SPRING_DATASOURCE_USERNAME:castrel}
    password: ${SPRING_DATASOURCE_PASSWORD:castrel}
    hikari:
      connection-timeout: 60000
  jdbc:
    template:
      query-timeout: 60s
  jpa:
    properties:
      hibernate.jdbc.timeout: 60
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:16379}

services:
  user-url: ${USER_SERVICE_URL:http://localhost:8081}
  catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
  payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8085}
  risk-url: ${RISK_SERVICE_URL:http://localhost:8088}
  promotion-url: ${PROMOTION_SERVICE_URL:http://localhost:8087}
  notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8090}
  cart-url: ${CART_SERVICE_URL:http://localhost:8091}

reports:
  optimized: ${REPORTS_OPTIMIZED:false}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
