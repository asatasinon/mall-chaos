server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["castrel-.*"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /castrel-(.+)
        target_label: service
        replacement: $1
      - source_labels: [__meta_docker_container_name]
        target_label: container
    pipeline_stages:
      # Parse JSON log lines produced by LogstashEncoder
      - json:
          expressions:
            log_level: level
            trace_id:  traceId
            log_msg:   message
      - labels:
          log_level:
          trace_id:
      - output:
          source: log_msg
