server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-mysql-plain
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["castrel-mysql"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: service
        replacement: mysql
      - source_labels: [__meta_docker_container_name]
        target_label: container

  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["castrel-.*"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /castrel-mysql
        action: drop
      - source_labels: [__meta_docker_container_name]
        regex: /castrel-(.+)
        target_label: service
        replacement: $1
      - source_labels: [__meta_docker_container_name]
        target_label: container
    pipeline_stages:
      # Parse JSON log lines produced by LogstashEncoder
      - json:
          expressions:
            log_level: level
            business_trace_id: traceId
            trace_id:          trace_id
            span_id:           span_id
            log_msg:   message
      - labels:
          log_level:
          business_trace_id:
      - template:
          source: log_msg
          template: '{{ if .trace_id }}[trace_id={{ .trace_id }} span_id={{ .span_id }}] {{ end }}{{ .log_msg }}'
      - output:
          source: log_msg
