# Alertmanager configuration - Castrel Chaos
# Alert routing rules: distribute notifications by severity and labels
global:
  # Initial alert wait time: how long to wait after an alert fires before sending a notification
  resolve_timeout: 5m

route:
  # Default receiver
  receiver: 'default-receiver'
  # Grouping criteria: alerts with the same group_by labels are combined into one notification
  group_by: ['alertname', 'severity', 'service']
  # Initial notification wait for a group (allow more alerts to accumulate before sending)
  group_wait: 30s
  # Notification interval for the same group
  group_interval: 3m
  # Alert repeat interval: how often to resend the same alert before it resolves
  repeat_interval: 5m
  # Child routes: split by severity
  routes:
    - receiver: 'critical-receiver'
      match:
        severity: critical
      repeat_interval: 2m
      continue: false

    - receiver: 'warning-receiver'
      match:
        severity: warning
      repeat_interval: 5m
      continue: false

receivers:
  # ── Default receiver: record only; do not send external notifications ─────────────────
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://traffic-control-plane:3086/internal/alertmanager/webhook'
        send_resolved: true

  # ── Critical receiver: logs plus configurable webhook ────────────────────────────
  - name: 'critical-receiver'
    webhook_configs:
      - url: 'http://traffic-control-plane:3086/internal/alertmanager/webhook'
        send_resolved: true

  # ── Warning receiver ──────────────────────────────────────────────────────
  - name: 'warning-receiver'
    webhook_configs:
      - url: 'http://traffic-control-plane:3086/internal/alertmanager/webhook'
        send_resolved: true