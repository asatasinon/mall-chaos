events {
  worker_connections 1024;
}

http {
  # ── Prometheus ───────────────────────────────────────────────────────────────
  server {
    listen 19090;
    server_name _;

    location / {
      auth_basic "Prometheus";
      auth_basic_user_file /etc/nginx/.htpasswd;

      proxy_pass http://prometheus:9090;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
  }

  # ── Loki ─────────────────────────────────────────────────────────────────────
  server {
    listen 13100;
    server_name _;

    # Increase buffer sizes for log push payloads
    client_max_body_size 10m;

    location / {
      auth_basic "Loki";
      auth_basic_user_file /etc/nginx/.htpasswd;

      proxy_pass http://loki:3100;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
  }

  # ── Tempo ─────────────────────────────────────────────────────────────────────
  server {
    listen 13200;
    server_name _;

    location / {
      auth_basic "Tempo";
      auth_basic_user_file /etc/nginx/.htpasswd;

      proxy_pass http://tempo:3200;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
  }

  # ── SkyWalking UI ─────────────────────────────────────────────────────────────
  # Active only when --profile skywalking is used.
  # Uses a variable for proxy_pass so nginx resolves skywalking-ui lazily at
  # request time (not at startup), allowing nginx to start without the service.
  server {
    listen 13091;
    server_name _;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
      auth_basic "SkyWalking";
      auth_basic_user_file /etc/nginx/.htpasswd;

      set $sw_upstream http://skywalking-ui:8080;
      proxy_pass $sw_upstream;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
  }
}
