# Redis configuration for Castrel Chaos
# Used for: order idempotency locks, distributed inventory locks, runner state cache

bind 0.0.0.0
protected-mode no
port 6379

# Memory policy — LRU eviction as required by task spec
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence — disabled for dev (pure cache use-case)
appendonly no
save ""

# Connection settings
timeout 300
tcp-keepalive 60
maxclients 100

# Logging
loglevel notice
