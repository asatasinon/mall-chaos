server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13306/castrel?useSSL=false&serverTimezone=Asia/Shanghai&connectionTimeZone=%2B08:00&allowPublicKeyRetrieval=true&connectTimeout=60000&socketTimeout=60000}
    username: ${SPRING_DATASOURCE_USERNAME:castrel}
    password: ${SPRING_DATASOURCE_PASSWORD:castrel}
    hikari:
      connection-timeout: 60000
  jdbc:
    template:
      query-timeout: 60s
  jpa:
    properties:
      hibernate.jdbc.timeout: 60
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:16379}

castrel:
  security:
    jwt:
      issuer: ${CASTREL_JWT_ISSUER:castrel-user-service}
      audience: ${CASTREL_JWT_AUDIENCE:castrel-gateway}
      access-ttl: ${CASTREL_JWT_ACCESS_TTL:P7D}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
