# Replace these placeholders with a deployment-managed, read-only exporter account.
# Do not put production credentials in this file or in a ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: mysqld-exporter-secret
  namespace: castrel
type: Opaque
stringData:
  .my.cnf: |
    [client]
    user = REPLACE_WITH_EXPORTER_USER
    password = REPLACE_WITH_SECRET
    host = mysql
    port = 3306
