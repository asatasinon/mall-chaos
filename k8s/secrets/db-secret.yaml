# IMPORTANT: Replace base64 values before applying to production.
# Generate: echo -n 'castrel' | base64
# castrel -> Y2FzdHJlbA==
# root    -> cm9vdA==
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: castrel
type: Opaque
data:
  SPRING_DATASOURCE_USERNAME: Y2FzdHJlbA==   # castrel
  SPRING_DATASOURCE_PASSWORD: Y2FzdHJlbA==   # castrel
  MYSQL_ROOT_PASSWORD: cm9vdA==              # root
  MYSQL_USER: Y2FzdHJlbA==                   # castrel
  MYSQL_PASSWORD: Y2FzdHJlbA==              # castrel
