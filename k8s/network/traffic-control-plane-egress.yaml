apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traffic-control-plane-egress
  namespace: castrel
spec:
  podSelector:
    matchLabels:
      app: traffic-control-plane
  policyTypes:
    - Egress
  egress:
    # Allow cluster DNS lookups without granting general egress to kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: castrel
          podSelector:
            matchLabels:
              app: mysql
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: castrel
          podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: castrel
          podSelector:
            matchLabels:
              app: gateway-service
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: castrel
          podSelector:
            matchLabels:
              app: notification-restart-broker
      ports:
        - protocol: TCP
          port: 8095
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: castrel
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: castrel
          podSelector:
            matchLabels:
              app: alertmanager
      ports:
        - protocol: TCP
          port: 9093
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: castrel
          podSelector:
            matchLabels:
              app: loki
      ports:
        - protocol: TCP
          port: 3100
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: castrel
          podSelector:
            matchLabels:
              app: tempo
      ports:
        - protocol: TCP
          port: 3200
        - protocol: TCP
          port: 4318
