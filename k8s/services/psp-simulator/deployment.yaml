apiVersion: apps/v1
kind: Deployment
metadata:
  name: psp-simulator
  namespace: castrel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: psp-simulator
  template:
    metadata:
      labels:
        app: psp-simulator
    spec:
      containers:
        - name: psp-simulator
          image: castrel/psp-simulator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8092
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: traffic-lifecycle-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8092
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8092
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: psp-simulator
  namespace: castrel
spec:
  selector:
    app: psp-simulator
  ports:
    - port: 8092
      targetPort: 8092
  type: ClusterIP
