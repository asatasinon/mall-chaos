apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-runner-service
  namespace: castrel
spec:
  replicas: 1   # must be single instance to avoid duplicate traffic
  selector:
    matchLabels:
      app: traffic-runner-service
  template:
    metadata:
      labels:
        app: traffic-runner-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8086"
    spec:
      containers:
        - name: traffic-runner-service
          image: castrel/traffic-runner-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret
          env:
            - name: RUNNER_TARGET_BASE_URL
              value: "http://gateway-service:8080"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-runner-service
  namespace: castrel
spec:
  selector:
    app: traffic-runner-service
  ports:
    - port: 8086
      targetPort: 8086
  type: ClusterIP
