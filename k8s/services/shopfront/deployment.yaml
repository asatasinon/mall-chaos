apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopfront
  namespace: castrel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopfront
  template:
    metadata:
      labels:
        app: shopfront
    spec:
      containers:
        - name: shopfront
          image: castrel/shopfront:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3090
          env:
            - name: NODE_ENV
              value: production
            - name: GATEWAY_BASE_URL
              value: "http://gateway-service:8080"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /
              port: 3090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3090
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: shopfront
  namespace: castrel
spec:
  selector:
    app: shopfront
  ports:
    - port: 3090
      targetPort: 3090
  type: ClusterIP
