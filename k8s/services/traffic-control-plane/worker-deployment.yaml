apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-control-plane-worker
  namespace: castrel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-control-plane-worker
  template:
    metadata:
      labels:
        app: traffic-control-plane-worker
    spec:
      containers:
        - name: traffic-control-plane-worker
          image: castrel/traffic-control-plane:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "node_modules/tsx/dist/cli.mjs", "src/worker/index.ts"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret
            - secretRef:
                name: traffic-lifecycle-secret
          env:
            - name: GATEWAY_BASE_URL
              value: "http://gateway-service:8080"
            - name: NODE_ENV
              value: "production"
            - name: TZ
              value: "Asia/Shanghai"
            - name: APP_TIME_ZONE
              value: "Asia/Shanghai"
            - name: DATA_WARMUP_ENABLED
              value: "true"
            - name: DATA_WARMUP_WINDOW_DAYS
              value: "180"
            - name: DATA_WARMUP_ROWS_PER_DAY
              value: "300000"
            - name: DATA_WARMUP_TARGET_ROWS
              value: "54000000"
            - name: DATA_WARMUP_BATCH_SIZE
              value: "500"
            - name: DATA_WARMUP_BATCH_INTERVAL_MS
              value: "1000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      restartPolicy: Always