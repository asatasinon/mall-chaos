apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-control-plane
  namespace: castrel
spec:
  replicas: 1   # must be single instance to avoid duplicate traffic
  selector:
    matchLabels:
      app: traffic-control-plane
  template:
    metadata:
      labels:
        app: traffic-control-plane
      annotations:
        prometheus.io/scrape: "false"
    spec:
      containers:
        - name: traffic-control-plane
          image: castrel/traffic-control-plane:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3086
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret
          env:
            - name: GATEWAY_BASE_URL
              value: "http://gateway-service:8080"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 3086
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3086
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-control-plane
  namespace: castrel
spec:
  selector:
    app: traffic-control-plane
  ports:
    - port: 3086
      targetPort: 3086
  type: ClusterIP
