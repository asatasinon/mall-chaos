# Pod kill chaos: randomly kills one order-service pod every 5 minutes.
# Used to verify pod restart resilience and traffic failover.
# Usage: kubectl apply -f k8s/chaos/pod-kill.yaml
# Remove: kubectl delete -f k8s/chaos/pod-kill.yaml
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: order-pod-kill
  namespace: castrel
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - castrel
    labelSelectors:
      app: order-service
  duration: "30s"
  scheduler:
    cron: "@every 5m"
