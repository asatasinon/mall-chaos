# Memory stress chaos: allocates 256 MB in payment-service pods for 5 minutes.
# Used to verify heap-pressure alerts and GC behavior under load.
# Usage: kubectl apply -f k8s/chaos/stress-mem.yaml
# Remove: kubectl delete -f k8s/chaos/stress-mem.yaml
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: payment-stress-mem
  namespace: castrel
spec:
  mode: one
  selector:
    namespaces:
      - castrel
    labelSelectors:
      app: payment-service
  stressors:
    memory:
      workers: 2
      size: "256MB"
  duration: "5m"
