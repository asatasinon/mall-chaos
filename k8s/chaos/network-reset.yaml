# Network chaos: order-service → inventory-service connection reset.
# Simulates inventory service being unreachable from order service.
# Usage: kubectl apply -f k8s/chaos/network-reset.yaml
# Remove: kubectl delete -f k8s/chaos/network-reset.yaml
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: order-to-inventory-reset
  namespace: castrel
spec:
  action: loss
  mode: one
  selector:
    namespaces:
      - castrel
    labelSelectors:
      app: order-service
  loss:
    loss: "100"
    correlation: "100"
  direction: egress
  target:
    selector:
      namespaces:
        - castrel
      labelSelectors:
        app: inventory-service
    mode: all
  duration: "1m"
