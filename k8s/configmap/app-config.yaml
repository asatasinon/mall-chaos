apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: castrel
data:
  SPRING_PROFILES_ACTIVE: "docker"
  CASTREL_JWT_ISSUER: "castrel-user-service"
  CASTREL_JWT_AUDIENCE: "castrel-gateway"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/castrel?useSSL=false&serverTimezone=Asia/Shanghai&connectionTimeZone=%2B08:00&allowPublicKeyRetrieval=true&connectTimeout=60000&socketTimeout=60000"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  OBSERVABILITY_ENABLED: "true"
  OBSERVABILITY_OTLP_TRANSPORT: "http"
  OBSERVABILITY_OTLP_ENDPOINT: "http://tempo:4318/v1/traces"
  CART_SERVICE_URL: "http://cart-service:8091"
  USER_SERVICE_URL: "http://user-service:8081"
  ORDER_SERVICE_URL: "http://order-service:8084"
  CATALOG_SERVICE_URL: "http://catalog-service:8082"
  INVENTORY_SERVICE_URL: "http://inventory-service:8083"
  PAYMENT_SERVICE_URL: "http://payment-service:8085"
  PROMOTION_SERVICE_URL: "http://promotion-service:8087"
  RISK_SERVICE_URL: "http://risk-service:8088"
  FULFILLMENT_SERVICE_URL: "http://fulfillment-service:8089"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8090"
  PSP_SIMULATOR_URL: "http://psp-simulator:8092"
  APP_TIME_ZONE: "Asia/Shanghai"
  TZ: "Asia/Shanghai"
  JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Shanghai"
  JAVA_OPTS: "-Xms256m -Xmx512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof"
  # These variables initialize data_warmup_config only when its row is absent.
  DATA_WARMUP_ENABLED: "true"
  DATA_WARMUP_WINDOW_DAYS: "180"
  DATA_WARMUP_ROWS_PER_DAY: "300000"
  DATA_WARMUP_TARGET_ROWS: "54000000"
  DATA_WARMUP_BATCH_SIZE: "1000"
  DATA_WARMUP_BATCH_INTERVAL_MS: "1000"
  DATA_WARMUP_MAX_CONCURRENCY: "2"
  DATA_WARMUP_DB_CONCURRENCY: "2"
  CASTREL_RELEASE_REVISION: "1.4.0"
  CASTREL_DEPLOYMENT_MODE: "kubernetes"
  FAULT_RUN_RECONCILIATION_MODE: "OFF"
  FAULT_RUN_OWNER_LEASE_TTL_MS: "30000"
  FAULT_RUN_OWNER_HEARTBEAT_MS: "10000"
  FAULT_RUN_RECONCILE_INTERVAL_MS: "1000"
  FAULT_RUN_OWNER_ID_PREFIX: "traffic-control-plane-worker"
  BASELINE_CAPTURE_ENABLED: "false"
  BASELINE_OBSERVATION_CHECK_TIMEOUT_MS: "5000"
  BASELINE_OBSERVATION_WINDOW_SEC: "900"
