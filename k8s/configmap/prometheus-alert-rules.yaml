apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: castrel
data:
  alert-rules.yml: |
    groups:

      # 1. Service availability
      - name: castrel-service-health
        interval: 30s
        rules:
          - alert: ServiceDown
            expr: up{service!~"node|mysql|redis|traffic-control-plane"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 'Service {{ $labels.service }} is down'
              description: 'Service {{ $labels.service }} (job={{ $labels.job }}) has stopped responding for more than 1 minute.'

          - alert: InfraExporterDown
            expr: up{service=~"node|mysql|redis"} == 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: 'Infrastructure exporter {{ $labels.service }} is down'
              description: 'Exporter {{ $labels.service }} (job={{ $labels.job }}) has stopped responding for more than 1 minute.'

      # 2. HTTP request error rate and latency
      - name: castrel-http-performance
        interval: 30s
        rules:
          - alert: HighErrorRate
            expr: |
              sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (service, uri)
              /
              sum(rate(http_server_requests_seconds_count[5m])) by (service, uri)
              > 0.05
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: '{{ $labels.service }} error rate is too high'
              description: 'The error rate for URI {{ $labels.uri }} on service {{ $labels.service }} exceeded 5% in the last 5 minutes (current: {{ $value | humanizePercentage }}).'

          - alert: TrafficSurge
            expr: |
              (
                sum(rate(http_server_requests_seconds_count[5m])) by (service, uri)
                > 10
              )
              and
              (
                sum(rate(http_server_requests_seconds_count[5m])) by (service, uri)
                /
                sum(rate(http_server_requests_seconds_count[1h])) by (service, uri)
                > 2
              )
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: '{{ $labels.service }} is receiving a traffic surge'
              description: 'Request traffic for URI {{ $labels.uri }} on service {{ $labels.service }} is {{ $value | humanize }} requests per second, more than twice its 1-hour average.'

          - alert: HighLatencyP99
            expr: |
              histogram_quantile(0.99,
                sum(rate(http_server_requests_seconds_bucket[5m])) by (service, uri, le)
              ) > 5
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: '{{ $labels.service }} P99 latency is too high'
              description: 'P99 latency for URI {{ $labels.uri }} on service {{ $labels.service }} exceeded 5 seconds (current: {{ $value | humanizeDuration }}).'

          - alert: CriticalLatencyP99
            expr: |
              histogram_quantile(0.99,
                sum(rate(http_server_requests_seconds_bucket[5m])) by (service, uri, le)
              ) > 10
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: '{{ $labels.service }} P99 latency is critical'
              description: 'P99 latency for URI {{ $labels.uri }} on service {{ $labels.service }} exceeded 10 seconds (current: {{ $value | humanizeDuration }}).'

      # 3. JVM memory and GC
      - name: castrel-jvm-health
        interval: 30s
        rules:
          - alert: HighHeapUsage
            expr: |
              jvm_memory_used_bytes{area="heap"}
              /
              jvm_memory_max_bytes{area="heap"}
              > 0.85
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: '{{ $labels.service }} heap usage is too high'
              description: 'Heap usage for service {{ $labels.service }} reached {{ $value | humanizePercentage }}, exceeding the 85% threshold.'

          - alert: CriticalHeapUsage
            expr: |
              jvm_memory_used_bytes{area="heap"}
              /
              jvm_memory_max_bytes{area="heap"}
              > 0.95
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: '{{ $labels.service }} heap is nearly exhausted'
              description: 'Heap usage for service {{ $labels.service }} reached {{ $value | humanizePercentage }}, exceeding the 95% threshold and potentially triggering OOM.'

          - alert: FrequentGCPause
            expr: |
              rate(jvm_gc_pause_seconds_count{action="end of major GC"}[5m]) > 0.1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: '{{ $labels.service }} has frequent Major GC pauses'
              description: 'Service {{ $labels.service }} had more than 0.1 Major GC pauses per second in the last 5 minutes (current: {{ $value | humanize }} per second).'

      # 4. Database connection pool (HikariCP)
      - name: castrel-database
        interval: 30s
        rules:
          - alert: HikariPoolExhaustion
            expr: |
              hikaricp_connections_active
              /
              hikaricp_connections_max
              > 0.80
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: '{{ $labels.service }} database connection pool usage is too high'
              description: 'The HikariCP connection pool usage for service {{ $labels.service }} reached {{ $value | humanizePercentage }}.'

          - alert: HikariPoolFull
            expr: |
              hikaricp_connections_active
              /
              hikaricp_connections_max
              > 0.95
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: '{{ $labels.service }} database connection pool is nearly exhausted'
              description: 'The HikariCP connection pool usage for service {{ $labels.service }} reached {{ $value | humanizePercentage }}; connections may be blocked.'

          - alert: HikariPoolPending
            expr: hikaricp_connections_pending > 10
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: '{{ $labels.service }} has pending database connections'
              description: '{{ $value }} requests are waiting for connections in the HikariCP pool for service {{ $labels.service }}.'

      # 5. Business metric anomalies
      - name: castrel-business-metrics
        interval: 30s
        rules:
          - alert: OrderFailureRateHigh
            expr: |
              rate(order_create_fail_count_total[5m])
              /
              (rate(order_create_success_count_total[5m]) + rate(order_create_fail_count_total[5m]))
              > 0.10
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 'Order creation failure rate is too high'
              description: 'The order creation failure rate is {{ $value | humanizePercentage }}, exceeding the 10% threshold.'

          - alert: PaymentFailureRateHigh
            expr: |
              rate(payment_charge_fail_count_total[5m])
              /
              (rate(payment_charge_success_count_total[5m]) + rate(payment_charge_fail_count_total[5m]))
              > 0.10
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 'Payment failure rate is too high'
              description: 'The payment charge failure rate is {{ $value | humanizePercentage }}, exceeding the 10% threshold.'

          - alert: PaymentTimeoutSpike
            expr: |
              rate(payment_charge_timeout_count_total[5m]) > 0.5
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: 'Payment timeouts are spiking'
              description: 'The payment charge timeout rate is {{ $value | humanize }} per second; an upstream service may be unhealthy.'

          - alert: InventoryReserveFailRateHigh
            expr: |
              rate(inventory_reserve_fail_count_total[5m])
              /
              (rate(inventory_reserve_success_count_total[5m]) + rate(inventory_reserve_fail_count_total[5m]))
              > 0.20
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: 'Inventory reservation failure rate is too high'
              description: 'The inventory reservation failure rate is {{ $value | humanizePercentage }}, exceeding the 20% threshold.'

          - alert: RiskRejectRateHigh
            expr: |
              rate(risk_pre_check_reject_count_total[5m])
              /
              (rate(risk_pre_check_pass_count_total[5m]) + rate(risk_pre_check_reject_count_total[5m]))
              > 0.50
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: 'Risk rejection rate is too high'
              description: 'The risk pre-check rejection rate is {{ $value | humanizePercentage }}, exceeding the 50% threshold.'

          - alert: NotificationFailRateHigh
            expr: |
              rate(notification_fail_count_total[5m])
              /
              (rate(notification_sent_count_total[5m]) + rate(notification_fail_count_total[5m]))
              > 0.10
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: 'Notification failure rate is too high'
              description: 'The notification failure rate is {{ $value | humanizePercentage }}, exceeding the 10% threshold.'

      # 6. Infrastructure (Node / MySQL / Redis)
      - name: castrel-infrastructure
        interval: 30s
        rules:
          - alert: NodeHighCPU
            expr: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) by (instance) * 100 > 80
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: 'Node CPU usage is too high'
              description: 'CPU usage on node {{ $labels.instance }} exceeded 80% (current: {{ $value | humanize }}%).'

          - alert: NodeHighMemory
            expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: 'Node memory usage is too high'
              description: 'Memory usage on node {{ $labels.instance }} exceeded 85% (current: {{ $value | humanize }}%).'

          - alert: NodeDataFilesystemUsageHigh
            expr: |
              (
                1 - node_filesystem_avail_bytes{mountpoint="/data",fstype="ext4"}
                /
                node_filesystem_size_bytes{mountpoint="/data",fstype="ext4"}
              ) * 100 > 85
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: 'Node data filesystem usage is high'
              description: 'The /data filesystem on node {{ $labels.instance }} has exceeded 85% utilization (current: {{ $value | humanize }}%).'

          - alert: NodeDataFilesystemGrowthRateHigh
            expr: |
              deriv(node_filesystem_avail_bytes{mountpoint="/data",fstype="ext4"}[15m])
              < -10485760
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: 'Node storage usage is continuously increasing'
              description: 'Available space on /data for node {{ $labels.instance }} is decreasing at {{ $value | humanize }} bytes/s; a sudden increase in storage usage may be occurring.'

          - alert: MySQLHighThreads
            expr: mysql_global_status_threads_connected > 100
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: 'MySQL connection count is too high'
              description: 'MySQL currently has {{ $value }} connections, exceeding the threshold of 100.'

          - alert: MySQLSlowQueries
            expr: rate(mysql_global_status_slow_queries[5m]) > 0.5
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: 'MySQL slow queries are increasing'
              description: 'The MySQL slow query rate is {{ $value | humanize }} per second; an SQL performance issue may exist.'

          - alert: MySQLInnoDBDataWriteRateHigh
            expr: |
              rate(mysql_global_status_innodb_data_written[5m])
              > 1048576
            for: 1m
            labels:
              severity: info
            annotations:
              summary: 'MySQL InnoDB data write rate is high'
              description: 'MySQL InnoDB data is being written at {{ $value | humanize }} bytes/s, exceeding 1 MiB/s; a sudden increase in storage usage may be occurring.'

          - alert: RedisHighMemory
            expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 80
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: 'Redis memory usage is too high'
              description: 'Redis memory usage is {{ $value | humanize }}%, exceeding the 80% threshold.'

      # 7. Correlated service degradation
      - name: castrel-chaos-detection
        interval: 30s
        rules:
          - alert: CorrelatedServiceDegradation
            expr: |
              (rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0)
              and
              (rate(inventory_reserve_fail_count_total[5m]) > 0)
              or
              (rate(payment_charge_timeout_count_total[5m]) > 0)
            for: 1m
            labels:
              severity: info
            annotations:
              summary: 'Correlated service degradation detected'
              description: 'Multiple services are reporting errors or timeouts simultaneously.'
