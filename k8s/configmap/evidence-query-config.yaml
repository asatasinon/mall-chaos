apiVersion: v1
kind: ConfigMap
metadata:
  name: evidence-query-config
  namespace: castrel
data:
  EVIDENCE_MANIFEST_CAPTURE_ENABLED: "false"
  EVIDENCE_QUERY_ENABLED: "false"
  EVIDENCE_QUERY_EXECUTION_ENABLED: "false"
  EVIDENCE_PROMETHEUS_BASE_URL: "http://prometheus:9090"
  EVIDENCE_LOKI_BASE_URL: "http://loki:3100"
  EVIDENCE_TEMPO_BASE_URL: "http://tempo:3200"
  EVIDENCE_SOURCE_TIMEOUT_MS: "5000"
  EVIDENCE_REPORT_TOTAL_TIMEOUT_MS: "15000"
  EVIDENCE_MAX_PARALLEL_RECIPES: "4"
  EVIDENCE_MAX_CONCURRENT_REPORTS: "1"
  EVIDENCE_MAX_RESPONSE_BYTES: "1048576"
  EVIDENCE_PROMETHEUS_RETENTION_SEC: "604800"
  EVIDENCE_LOKI_RETENTION_SEC: "604800"
  EVIDENCE_TEMPO_RETENTION_SEC: "604800"
