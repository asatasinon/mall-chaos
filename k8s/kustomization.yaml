apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Bootstrap only. Workloads, Jobs and ingress are applied by explicit release stages.
namespace: castrel

resources:
  # Namespace must come first
  - namespace.yaml

  # Config & Secrets
  - configmap/app-config.yaml
  - configmap/evidence-query-config.yaml
  - configmap/mysql-config.yaml
  - configmap/prometheus-alert-rules.yaml
  - secrets/db-secret.yaml
  - secrets/evidence-query-secret.yaml
  - secrets/mysqld-exporter-secret.yaml
  - secrets/traffic-lifecycle-secret.yaml

  # Isolate Web/API egress; the Worker remains unchanged.
  - network/traffic-control-plane-egress.yaml

  # Infrastructure
  - infra/mysql.yaml
  - infra/redis.yaml
  - infra/exporters.yaml
  - infra/prometheus.yaml
  - infra/alertmanager.yaml
  - infra/grafana.yaml
  - infra/loki.yaml
  - infra/tempo.yaml
