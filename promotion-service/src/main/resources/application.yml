server:
  port: 8087

spring:
  application:
    name: promotion-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13306/castrel?useSSL=false&serverTimezone=Asia/Shanghai&connectionTimeZone=%2B08:00&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=30000}
    username: ${SPRING_DATASOURCE_USERNAME:castrel}
    password: ${SPRING_DATASOURCE_PASSWORD:castrel}
    hikari:
      connection-timeout: 30000
  jdbc:
    template:
      query-timeout: 30s
  jpa:
    properties:
      hibernate.jdbc.timeout: 30
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:16379}

promotion:
  demo-coupon-pool:
    enabled: ${PROMOTION_DEMO_COUPON_POOL_ENABLED:true}
    customer-ids: ${PROMOTION_DEMO_COUPON_CUSTOMER_IDS:1,2}
    promotion-types: ${PROMOTION_DEMO_COUPON_PROMOTION_TYPES:DISCOUNT,COUPON}
    target-available-count: ${PROMOTION_DEMO_COUPON_TARGET_AVAILABLE_COUNT:3}
    replenish-below-count: ${PROMOTION_DEMO_COUPON_REPLENISH_BELOW_COUNT:1}
    validity-hours: ${PROMOTION_DEMO_COUPON_VALIDITY_HOURS:168}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
