server:
  port: 8082

spring:
  application:
    name: catalog-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13306/castrel?useSSL=false&serverTimezone=Asia/Shanghai&connectionTimeZone=%2B08:00&allowPublicKeyRetrieval=true&connectTimeout=60000&socketTimeout=60000}
    username: ${SPRING_DATASOURCE_USERNAME:castrel}
    password: ${SPRING_DATASOURCE_PASSWORD:castrel}
    hikari:
      connection-timeout: 60000
  jdbc:
    template:
      query-timeout: 60s
  jpa:
    properties:
      hibernate.jdbc.timeout: 60
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:16379}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}

catalog:
  product-detail-cache:
    default-key: ${CATALOG_PRODUCT_DETAIL_CACHE_KEY:catalog:product-detail:cache}
    active-marker-key: ${CATALOG_PRODUCT_DETAIL_ACTIVE_MARKER_KEY:catalog:product-detail:active}
    active-marker-owner-key: ${CATALOG_PRODUCT_DETAIL_ACTIVE_MARKER_OWNER_KEY:catalog:product-detail:active:owner}
    active-marker-fence-key: ${CATALOG_PRODUCT_DETAIL_ACTIVE_MARKER_FENCE_KEY:catalog:product-detail:active:fence}
    logical-ttl: ${CATALOG_PRODUCT_DETAIL_CACHE_TTL:PT5M}
    run-fallback-ttl: ${CATALOG_PRODUCT_DETAIL_RUN_FALLBACK_TTL:PT31M}
    database-timeout-sec: ${CATALOG_PRODUCT_DETAIL_DB_TIMEOUT_SEC:2}
    max-logical-bytes: ${CATALOG_PRODUCT_DETAIL_MAX_LOGICAL_BYTES:536870912}
    max-member-count: ${CATALOG_PRODUCT_DETAIL_MAX_MEMBER_COUNT:47}
    max-member-size-bytes: ${CATALOG_PRODUCT_DETAIL_MAX_MEMBER_SIZE_BYTES:134217728}
    cleanup-grace-seconds: ${CATALOG_PRODUCT_DETAIL_CLEANUP_GRACE_SECONDS:60}

reports:
  optimized: ${REPORTS_OPTIMIZED:false}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
