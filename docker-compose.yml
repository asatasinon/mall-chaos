      <<: *java-service-env
      OTEL_SERVICE_NAME: notification-service
      SW_AGENT_NAME: notification-service
      CW_APP_NAME: ${NOTIFICATION_CW_APP_NAME:-notification-service}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/actuator/health"]
      <<: *healthcheck-defaults

  # ─── SkyWalking（opt-in：docker compose --profile skywalking up -d）──────────
  # TRACING_MODE=sw-only  → SkyWalking agent only; OTel disabled
  # TRACING_MODE=both     → Report to OTel and SkyWalking simultaneously
  # TRACING_MODE=otel-only (default) → This profile is not required

  skywalking-oap:
    image: ${SKYWALKING_OAP_IMAGE:-apache/skywalking-oap-server:${SKYWALKING_VERSION:-10.2.0}}
    container_name: castrel-skywalking-oap
    <<: *service-defaults
    environment:
      SW_STORAGE: mysql
      SW_JDBC_URL: "jdbc:mysql://mysql:3306/skywalking?rewriteBatchedStatements=true&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai&connectionTimeZone=+08:00&allowPublicKeyRetrieval=true"
      SW_DATA_SOURCE_USER: ${MYSQL_USER:-castrel}
      SW_DATA_SOURCE_PASSWORD: ${MYSQL_PASSWORD:-castrel}
      SW_JDBC_DRIVER: com.mysql.cj.jdbc.Driver
      SW_OTEL_RECEIVER: default
    volumes:
      - ./infra/skywalking/ext-libs/mysql-connector-j-8.0.33.jar:/skywalking/oap-libs/mysql-connector-j-8.0.33.jar:ro
    ports:
      - "11800:11800"   # gRPC agent ingestion
      - "12800:12800"   # HTTP REST / GraphQL API
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - skywalking

  skywalking-ui:
    image: ${SKYWALKING_UI_IMAGE:-apache/skywalking-ui:${SKYWALKING_VERSION:-10.2.0}}
    container_name: castrel-skywalking-ui
    <<: *service-defaults
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    # Exposed through obs-auth-proxy on host port 13091.
    depends_on:
      - skywalking-oap
    profiles:
      - skywalking

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: castrel-redis-exporter
    <<: *service-defaults
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_EXPORTER_CHECK_SINGLE_KEYS: "castrel:query:enrichment:order-service,castrel:query:enrichment:user-service,castrel:query:enrichment:catalog-service,castrel:query:enrichment:inventory-service,castrel:query:enrichment:payment-service,castrel:query:enrichment:promotion-service,castrel:query:enrichment:risk-service,castrel:query:enrichment:fulfillment-service,castrel:query:enrichment:notification-service,castrel:query:enrichment"
    ports:
      - "19121:9121"   # Optional; this port can also remain unmapped
    depends_on:
      redis:
        condition: service_healthy