networks:
  castrel-net:
    driver: bridge

volumes: {}

x-service-defaults: &service-defaults
  networks:
    - castrel-net
#  restart: unless-stopped

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: docker,chaos
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-castrel}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-castrel}
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-castrel}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  # OTel Java agent configuration
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://tempo:4318}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_TRACES_SAMPLER: parentbased_always_on
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m -javaagent:/app/opentelemetry-javaagent.jar -javaagent:/data/app/JavaAgent/lib/agent.jar=/data/app/JavaAgent"

x-cloudwise-agent-env: &cloudwise-agent-env
  CW_CONFIG_SERVER: ${CW_CONFIG_SERVER:-http://10.106.0.58:18080/docp}
  CW_DATA_SERVER: ${CW_DATA_SERVER:-http://10.106.0.58:18080/docp}
  CW_LICENSE_KEY: "${CW_LICENSE_KEY:-J45Engw88NeHUZ4Q7qNsK8L47FTH**QvgW113IEnsNaBNMR5zZ**oj/g!!!!}"

x-java-service-env: &java-service-env
  <<: [*service-env, *cloudwise-agent-env]
  JAVA_DUMP_DIR: /service-data/heapdumps

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 60s

services:

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  mysql:
    image: ${MYSQL_IMAGE:-harbor.cloudwise.com/noname/mysql:8.0}
    container_name: castrel-mysql
    <<: *service-defaults
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-castrel}
      MYSQL_USER: ${MYSQL_USER:-castrel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-castrel}
    ports:
      - "13306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./infra/mysql/my.cnf:/etc/mysql/conf.d/castrel.cnf:ro
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucastrel", "-pcastrel"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:-harbor.cloudwise.com/noname/redis:7.2-alpine}
    container_name: castrel-redis
    <<: *service-defaults
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "16379:6379"
    volumes:
      - ./data/redis:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Observability（默认启动，可手动关闭：docker compose stop prometheus grafana loki tempo obs-auth-proxy mysqld-exporter node-exporter promtail）──

  prometheus:
    image: ${PROMETHEUS_IMAGE:-harbor.cloudwise.com/noname/prometheus:v3.11.2}
    container_name: castrel-prometheus
    <<: *service-defaults
    # Port 19090 is exposed via obs-auth-proxy (nginx) with basic auth
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
      - '--storage.tsdb.retention.time=7d'

  loki:
    image: ${LOKI_IMAGE:-harbor.cloudwise.com/noname/loki:3.6.10}
    container_name: castrel-loki
    <<: *service-defaults
    # Port 13100 is exposed via obs-auth-proxy (nginx) with basic auth
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./data/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml

  tempo:
    image: ${TEMPO_IMAGE:-harbor.cloudwise.com/noname/tempo:2.10.4}
    container_name: castrel-tempo
    <<: *service-defaults
    ports:
      # Port 13200 (HTTP API) is exposed via obs-auth-proxy (nginx) with basic auth
      - "14317:4317"   # OTLP gRPC — ingestion, no auth required
      - "14318:4318"   # OTLP HTTP — ingestion, no auth required
    volumes:
      - ./infra/tempo/tempo-config.yml:/etc/tempo/config.yml:ro
      - ./data/tempo:/tmp/tempo
    command: -config.file=/etc/tempo/config.yml

  grafana:
    image: ${GRAFANA_IMAGE:-harbor.cloudwise.com/noname/grafana:12.4.3}
    container_name: castrel-grafana
    <<: *service-defaults
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - obs-auth-proxy
      - prometheus
      - loki
      - tempo

  obs-auth-proxy:
    image: ${NGINX_IMAGE:-harbor.cloudwise.com/noname/nginx:alpine}
    container_name: castrel-obs-auth-proxy
    <<: *service-defaults
    ports:
      - "19090:19090"   # Prometheus (auth)
      - "13100:13100"   # Loki       (auth)
      - "13200:13200"   # Tempo      (auth)
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-harbor.cloudwise.com/noname/node-exporter:v1.9.1}
    container_name: castrel-node-exporter
    <<: *service-defaults
    pid: host
    ports:
      - "19100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  mysqld-exporter:
    image: ${MYSQLD_EXPORTER_IMAGE:-harbor.cloudwise.com/noname/mysqld-exporter:v0.15.1}
    container_name: castrel-mysqld-exporter
    <<: *service-defaults
    ports:
      - "19104:9104"
    volumes:
      - ./infra/mysql/mysqld-exporter.cnf:/.my.cnf:ro
    command:
      - '--config.my-cnf=/.my.cnf'
      - '--collect.global_status'
      - '--collect.global_variables'
      - '--collect.info_schema.innodb_metrics'
      - '--collect.info_schema.tables'
      - '--collect.info_schema.processlist'
      - '--collect.slave_status'
      - '--collect.perf_schema.eventsstatements'
      - '--collect.perf_schema.eventsstatementssum'
      - '--collect.perf_schema.eventswaits'
      - '--collect.perf_schema.file_events'
      - '--collect.perf_schema.indexiowaits'
      - '--collect.perf_schema.tableiowaits'
      - '--collect.perf_schema.tablelocks'
    depends_on:
      mysql:
        condition: service_healthy

  promtail:
    image: ${PROMTAIL_IMAGE:-harbor.cloudwise.com/noname/promtail:3.6.10}
    container_name: castrel-promtail
    <<: *service-defaults
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  toxiproxy:
    image: ${TOXIPROXY_IMAGE:-harbor.cloudwise.com/noname/toxiproxy:latest}
    container_name: castrel-toxiproxy
    <<: *service-defaults
    ports:
      - "18474:8474"   # ToxiProxy API
      - "18183:18083" # order-to-inventory proxy
      - "18184:18084" # gateway-to-order proxy
      - "18185:18085" # order-to-payment proxy
    volumes:
      - ./infra/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    command: -config=/config/toxiproxy.json -host=0.0.0.0

  # ─── Business Services ───────────────────────────────────────────────────────

  gateway-service:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/gateway-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: castrel-gateway
    <<: *service-defaults
    ports:
      - "18080:8080"
    volumes:
      - ./data/gateway-service:/service-data
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: gateway-service
      CW_APP_NAME: ${GATEWAY_CW_APP_NAME:-gateway-service}
      ORDER_SERVICE_URL: http://toxiproxy:18084
      CATALOG_SERVICE_URL: http://catalog-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8085
      PROMOTION_SERVICE_URL: http://promotion-service:8087
      RISK_SERVICE_URL: http://risk-service:8088
      FULFILLMENT_SERVICE_URL: http://fulfillment-service:8089
      NOTIFICATION_SERVICE_URL: http://notification-service:8090
      CHAOS_ORDER_URL: http://order-service:8084
      CHAOS_PAYMENT_URL: http://payment-service:8085
      CHAOS_CATALOG_URL: http://catalog-service:8082
      CHAOS_INVENTORY_URL: http://inventory-service:8083
      CHAOS_PROMOTION_URL: http://promotion-service:8087
      CHAOS_RISK_URL: http://risk-service:8088
      CHAOS_FULFILLMENT_URL: http://fulfillment-service:8089
      CHAOS_NOTIFICATION_URL: http://notification-service:8090
      TOXIPROXY_API_URL: http://toxiproxy:8474
      CHAOS_CONSOLE_GRAFANA_BASE_URL: ${CHAOS_CONSOLE_GRAFANA_BASE_URL:-http://localhost:13000}
    depends_on:
      - toxiproxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      <<: *healthcheck-defaults

  user-service:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/user-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: castrel-user
    <<: *service-defaults
    ports:
      - "18081:8081"
    volumes:
      - ./data/user-service:/service-data
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: user-service
      CW_APP_NAME: ${USER_CW_APP_NAME:-user-service}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      <<: *healthcheck-defaults

  catalog-service:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/catalog-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    container_name: castrel-catalog
    <<: *service-defaults
    ports:
      - "18082:8082"
    volumes:
      - ./data/catalog-service:/service-data
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: catalog-service
      CW_APP_NAME: ${CATALOG_CW_APP_NAME:-catalog-service}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      <<: *healthcheck-defaults

  inventory-service:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/inventory-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: castrel-inventory
    <<: *service-defaults
    ports:
      - "18083:8083"
    volumes:
      - ./data/inventory-service:/service-data
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: inventory-service
      CW_APP_NAME: ${INVENTORY_CW_APP_NAME:-inventory-service}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      <<: *healthcheck-defaults

  order-service:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/order-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: castrel-order
    <<: *service-defaults
    ports:
      - "18084:8084"
    volumes:
      - ./data/order-service:/service-data
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: order-service
      CW_APP_NAME: ${ORDER_CW_APP_NAME:-order-service}
      USER_SERVICE_URL: http://user-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      INVENTORY_SERVICE_URL: http://toxiproxy:18083
      PAYMENT_SERVICE_URL: http://toxiproxy:18085
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      <<: *healthcheck-defaults

  payment-service:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/payment-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: castrel-payment
    <<: *service-defaults
    ports:
      - "18085:8085"
    volumes:
      - ./data/payment-service:/service-data
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: payment-service
      CW_APP_NAME: ${PAYMENT_CW_APP_NAME:-payment-service}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      <<: *healthcheck-defaults

  traffic-control-plane:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/traffic-control-plane:${IMAGE_TAG:-latest}
    build:
      context: ./traffic-control-plane
      dockerfile: Dockerfile
    container_name: castrel-traffic-control-plane
    <<: *service-defaults
    ports:
      - "18086:3086"
    volumes:
      - ./data/traffic-control-plane:/app/data
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      GATEWAY_BASE_URL: http://gateway-service:8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-castrel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-castrel}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-castrel}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GRAFANA_BASE_URL: ${CHAOS_CONSOLE_GRAFANA_BASE_URL:-http://localhost:13000}
    depends_on:
      gateway-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3086/"]
      <<: *healthcheck-defaults

  traffic-control-plane-worker:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/traffic-control-plane:${IMAGE_TAG:-latest}
    build:
      context: ./traffic-control-plane
      dockerfile: Dockerfile
    container_name: castrel-traffic-control-plane-worker
    <<: *service-defaults
    command: ["pnpm", "worker"]
    volumes:
      - ./data/traffic-control-plane-worker:/app/data
    environment:
      NODE_ENV: production
      GATEWAY_BASE_URL: http://gateway-service:8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-castrel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-castrel}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-castrel}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GRAFANA_BASE_URL: ${CHAOS_CONSOLE_GRAFANA_BASE_URL:-http://localhost:13000}
    depends_on:
      gateway-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  promotion-service:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/promotion-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: promotion-service/Dockerfile
    container_name: castrel-promotion
    <<: *service-defaults
    ports:
      - "18087:8087"
    volumes:
      - ./data/promotion-service:/service-data
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: promotion-service
      CW_APP_NAME: ${PROMOTION_CW_APP_NAME:-promotion-service}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/actuator/health"]
      <<: *healthcheck-defaults

  risk-service:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/risk-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: risk-service/Dockerfile
    container_name: castrel-risk
    <<: *service-defaults
    ports:
      - "18088:8088"
    volumes:
      - ./data/risk-service:/service-data
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: risk-service
      CW_APP_NAME: ${RISK_CW_APP_NAME:-risk-service}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/actuator/health"]
      <<: *healthcheck-defaults

  fulfillment-service:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/fulfillment-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: fulfillment-service/Dockerfile
    container_name: castrel-fulfillment
    <<: *service-defaults
    ports:
      - "18089:8089"
    volumes:
      - ./data/fulfillment-service:/service-data
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: fulfillment-service
      CW_APP_NAME: ${FULFILLMENT_CW_APP_NAME:-fulfillment-service}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8089/actuator/health"]
      <<: *healthcheck-defaults

  notification-service:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/notification-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: castrel-notification
    <<: *service-defaults
    ports:
      - "18090:8090"
    volumes:
      - ./data/notification-service:/service-data
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: notification-service
      CW_APP_NAME: ${NOTIFICATION_CW_APP_NAME:-notification-service}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/actuator/health"]
      <<: *healthcheck-defaults

  # ─── Chaos Infrastructure (opt-in) ─────────────────────────────────────────

  pumba:
    image: gaiaadm/pumba:latest
    container_name: castrel-pumba
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles: ["chaos-pumba"]   # start with: docker-compose --profile chaos-pumba up -d pumba
    network_mode: none
