networks:
  castrel-net:
    driver: bridge

volumes: {}

x-service-defaults: &service-defaults
  networks:
    - castrel-net
#  restart: unless-stopped

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: docker
  TZ: Asia/Shanghai
  CASTREL_JWT_SECRET: ${CASTREL_JWT_SECRET:?CASTREL_JWT_SECRET must be set}
  CASTREL_INTERNAL_SERVICE_KEY: ${CASTREL_INTERNAL_SERVICE_KEY:?CASTREL_INTERNAL_SERVICE_KEY must be set}
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-castrel}?useSSL=false&serverTimezone=Asia/Shanghai&connectionTimeZone=+08:00&allowPublicKeyRetrieval=true
  SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-castrel}
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-castrel}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  # OTel Java agent configuration
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://tempo:4318}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_TRACES_SAMPLER: parentbased_always_on
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  ENABLE_OTEL_AGENT: ${ENABLE_OTEL_AGENT:-true}
  ENABLE_CLOUDWISE_AGENT: ${ENABLE_CLOUDWISE_AGENT:-true}
  # SkyWalking agent configuration (active when TRACING_MODE=sw-only or both)
  TRACING_MODE: ${TRACING_MODE:-otel-only}
  SW_AGENT_COLLECTOR_BACKEND_SERVICES: skywalking-oap:11800
  SW_AGENT_LOGGING_FILE_NAME: /dev/stdout
  JAVA_TOOL_OPTIONS: >-
    -Xms256m
    -Xmx256m
    -Dfile.encoding=UTF-8
    -Duser.timezone=Asia/Shanghai
    -Dsun.jnu.encoding=UTF-8
    -Djava.security.egd=file:/dev/./urandom
    -XX:+UseContainerSupport
    -XX:+UseG1GC
    -XX:+UseStringDeduplication
    -XX:+ParallelRefProcEnabled
    -XX:MaxGCPauseMillis=200
    -XX:InitialRAMPercentage=25.0
    -XX:MinRAMPercentage=25.0
    -XX:MaxRAMPercentage=75.0

x-cloudwise-agent-env: &cloudwise-agent-env
  CW_CONFIG_SERVER: ${CW_CONFIG_SERVER:-http://10.106.0.58:18080/docp}
  CW_DATA_SERVER: ${CW_DATA_SERVER:-http://10.106.0.58:18080/docp}
  CW_LICENSE_KEY: "${CW_LICENSE_KEY:-J45Engw88NeHUZ4Q7qNsK8L47FTH**QvgW113IEnsNaBNMR5zZ**oj/g!!!!}"

x-java-service-env: &java-service-env
  <<: [*service-env, *cloudwise-agent-env]
  JAVA_DUMP_DIR: /service-data/heapdumps

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 60s

services:

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  mysql:
    image: ${MYSQL_IMAGE:-harbor.cloudwise.com/noname/mysql:8.0}
    container_name: castrel-mysql
    <<: *service-defaults
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-castrel}
      MYSQL_USER: ${MYSQL_USER:-castrel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-castrel}
    ports:
      - "13306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./infra/mysql/my.cnf:/etc/mysql/conf.d/castrel.cnf:ro
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h localhost -u\"$$MYSQL_USER\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:-harbor.cloudwise.com/noname/redis:7.2-alpine}
    container_name: castrel-redis
    <<: *service-defaults
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "16379:6379"
    volumes:
      - ./data/redis:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Observability (starts by default; stop manually with: docker compose stop prometheus alertmanager grafana loki tempo obs-auth-proxy mysqld-exporter node-exporter promtail) ──

  prometheus:
    image: ${PROMETHEUS_IMAGE:-harbor.cloudwise.com/noname/prometheus:v3.11.2}
    container_name: castrel-prometheus
    <<: *service-defaults
    # Port 19090 is exposed via obs-auth-proxy (nginx) with basic auth
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus-rules:/etc/prometheus/rules
      - ./infra/prometheus/rules:/etc/prometheus/source-rules:ro
      - ./data/prometheus:/prometheus
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'mkdir -p /etc/prometheus/rules && if [ ! -f /etc/prometheus/rules/alert-rules.yml ]; then cp /etc/prometheus/source-rules/alert-rules.yml /etc/prometheus/rules/alert-rules.yml; fi && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --web.enable-lifecycle --web.enable-remote-write-receiver --storage.tsdb.retention.time=7d'

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-harbor.cloudwise.com/noname/alertmanager:v0.28.1}
    container_name: castrel-alertmanager
    <<: *service-defaults
    user: "${ALERTMANAGER_UID:-0}:${ALERTMANAGER_GID:-0}"
    volumes:
      - ./data/alertmanager-config:/etc/alertmanager
      - ./infra/alertmanager:/etc/alertmanager-source:ro
      - ./data/alertmanager:/alertmanager
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'mkdir -p /etc/alertmanager && if [ ! -f /etc/alertmanager/alertmanager.yml ]; then cp /etc/alertmanager-source/alertmanager.yml /etc/alertmanager/alertmanager.yml; fi && exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager --web.listen-address=:9093 --log.level=info'
    depends_on:
      - prometheus

  loki:
    image: ${LOKI_IMAGE:-harbor.cloudwise.com/noname/loki:3.6.10}
    container_name: castrel-loki
    <<: *service-defaults
    # Port 13100 is exposed via obs-auth-proxy (nginx) with basic auth
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./data/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml

  tempo:
    image: ${TEMPO_IMAGE:-harbor.cloudwise.com/noname/tempo:2.10.4}
    container_name: castrel-tempo
    <<: *service-defaults
    ports:
      # Port 13200 (HTTP API) is exposed via obs-auth-proxy (nginx) with basic auth
      - "14317:4317"   # OTLP gRPC — ingestion, no auth required
      - "14318:4318"   # OTLP HTTP — ingestion, no auth required
    volumes:
      - ./infra/tempo/tempo-config.yml:/etc/tempo/config.yml:ro
      - ./data/tempo:/tmp/tempo
    command: -config.file=/etc/tempo/config.yml

  grafana:
    image: ${GRAFANA_IMAGE:-harbor.cloudwise.com/noname/grafana:12.4.3}
    container_name: castrel-grafana
    <<: *service-defaults
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - obs-auth-proxy
      - prometheus
      - loki
      - tempo

  obs-auth-proxy:
    image: ${NGINX_IMAGE:-harbor.cloudwise.com/noname/nginx:alpine}
    container_name: castrel-obs-auth-proxy
    <<: *service-defaults
    ports:
      - "19090:19090"   # Prometheus (auth)
      - "19093:19093"   # Alertmanager (auth)
      - "13100:13100"   # Loki       (auth)
      - "13200:13200"   # Tempo      (auth)
      - "13091:13091"   # SkyWalking UI (auth, active when --profile skywalking)
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - prometheus
      - alertmanager
      - loki
      - tempo

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-harbor.cloudwise.com/noname/node-exporter:v1.9.1}
    container_name: castrel-node-exporter
    <<: *service-defaults
    pid: host
    ports:
      - "19100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  mysqld-exporter:
    image: ${MYSQLD_EXPORTER_IMAGE:-harbor.cloudwise.com/noname/mysqld-exporter:v0.15.1}
    container_name: castrel-mysqld-exporter
    <<: *service-defaults
    ports:
      - "19104:9104"
    volumes:
      - ./infra/mysql/mysqld-exporter.cnf:/.my.cnf:ro
    command:
      - '--config.my-cnf=/.my.cnf'
      - '--collect.global_status'
      - '--collect.global_variables'
      - '--collect.info_schema.innodb_metrics'
      - '--collect.info_schema.tables'
      - '--collect.info_schema.processlist'
      - '--collect.slave_status'
      - '--collect.perf_schema.eventsstatements'
      - '--collect.perf_schema.eventsstatementssum'
      - '--collect.perf_schema.eventswaits'
      - '--collect.perf_schema.file_events'
      - '--collect.perf_schema.indexiowaits'
      - '--collect.perf_schema.tableiowaits'
      - '--collect.perf_schema.tablelocks'
    depends_on:
      mysql:
        condition: service_healthy

  promtail:
    image: ${PROMTAIL_IMAGE:-harbor.cloudwise.com/noname/promtail:3.6.10}
    container_name: castrel-promtail
    <<: *service-defaults
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # ─── Business Services ───────────────────────────────────────────────────────

  gateway-service:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/gateway-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: castrel-gateway
    <<: *service-defaults
    ports:
      - "18080:8080"
    volumes:
      - ./data/gateway-service:/service-data
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: gateway-service
      SW_AGENT_NAME: gateway-service
      CW_APP_NAME: ${GATEWAY_CW_APP_NAME:-gateway-service}
      ORDER_SERVICE_URL: http://order-service:8084
      CART_SERVICE_URL: http://cart-service:8091
      USER_SERVICE_URL: http://user-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8085
      PROMOTION_SERVICE_URL: http://promotion-service:8087
      RISK_SERVICE_URL: http://risk-service:8088
      FULFILLMENT_SERVICE_URL: http://fulfillment-service:8089
      NOTIFICATION_SERVICE_URL: http://notification-service:8090
    depends_on:
      cart-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      <<: *healthcheck-defaults

  user-service:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/user-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: castrel-user
    <<: *service-defaults
    volumes:
      - ./data/user-service:/service-data
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: user-service
      SW_AGENT_NAME: user-service
      CW_APP_NAME: ${USER_CW_APP_NAME:-user-service}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      <<: *healthcheck-defaults

  cart-service:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/cart-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    container_name: castrel-cart
    <<: *service-defaults
    volumes:
      - ./data/cart-service:/service-data
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: cart-service
      SW_AGENT_NAME: cart-service
      CW_APP_NAME: ${CART_CW_APP_NAME:-cart-service}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/actuator/health"]
      <<: *healthcheck-defaults

  catalog-service:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/catalog-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    container_name: castrel-catalog
    <<: *service-defaults
    volumes:
      - ./data/catalog-service:/service-data
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: catalog-service
      SW_AGENT_NAME: catalog-service
      CW_APP_NAME: ${CATALOG_CW_APP_NAME:-catalog-service}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      <<: *healthcheck-defaults

  inventory-service:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/inventory-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: castrel-inventory
    <<: *service-defaults
    volumes:
      - ./data/inventory-service:/service-data
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: inventory-service
      SW_AGENT_NAME: inventory-service
      CW_APP_NAME: ${INVENTORY_CW_APP_NAME:-inventory-service}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      <<: *healthcheck-defaults

  order-service:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/order-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: castrel-order
    <<: *service-defaults
    volumes:
      - ./data/order-service:/service-data
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: order-service
      SW_AGENT_NAME: order-service
      CW_APP_NAME: ${ORDER_CW_APP_NAME:-order-service}
      USER_SERVICE_URL: http://user-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8085
      CART_SERVICE_URL: http://cart-service:8091
      RISK_SERVICE_URL: http://risk-service:8088
      PROMOTION_SERVICE_URL: http://promotion-service:8087
      NOTIFICATION_SERVICE_URL: http://notification-service:8090
      JAVA_TOOL_OPTIONS: >-
        -Xms512m
        -Xmx1024m
        -Dfile.encoding=UTF-8
        -Dsun.jnu.encoding=UTF-8
        -Djava.security.egd=file:/dev/./urandom
        -XX:+UseContainerSupport
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -XX:+ParallelRefProcEnabled
        -XX:MaxGCPauseMillis=200
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      <<: *healthcheck-defaults

  payment-service:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/payment-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: castrel-payment
    <<: *service-defaults
    volumes:
      - ./data/payment-service:/service-data
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: payment-service
      SW_AGENT_NAME: payment-service
      CW_APP_NAME: ${PAYMENT_CW_APP_NAME:-payment-service}
      ORDER_SERVICE_URL: http://order-service:8084
      PSP_SIMULATOR_URL: http://psp-simulator:8092
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      psp-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      <<: *healthcheck-defaults

  psp-simulator:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/psp-simulator:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: psp-simulator/Dockerfile
    container_name: castrel-psp-simulator
    <<: *service-defaults
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: psp-simulator
      SW_AGENT_NAME: psp-simulator
      CW_APP_NAME: ${PSP_CW_APP_NAME:-psp-simulator}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8092/actuator/health"]
      <<: *healthcheck-defaults

  traffic-control-plane:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/traffic-control-plane:${IMAGE_TAG:-latest}
    build:
      context: ./traffic-control-plane
      dockerfile: Dockerfile
    container_name: castrel-traffic-control-plane
    <<: *service-defaults
    # The alert config is a host bind mount. The image's UID 1001 does not
    # match macOS/Linux host ownership, so use root by default; override with
    # CONTROL_PLANE_UID/CONTROL_PLANE_GID when the host directory is prepared
    # for a non-root user.
    user: "${CONTROL_PLANE_UID:-0}:${CONTROL_PLANE_GID:-0}"
    ports:
      - "13086:3086"
    volumes:
      - ./data/traffic-control-plane:/app/data
      - ./data/prometheus-rules:/app/alert-data/prometheus-rules
      - ./data/alertmanager-config:/app/alert-data/alertmanager
      - ./infra/prometheus/rules:/app/infra-source/prometheus-rules:ro
      - ./infra/alertmanager:/app/infra-source/alertmanager:ro
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      HOSTNAME: 0.0.0.0
      GATEWAY_BASE_URL: http://gateway-service:8080
      CASTREL_INTERNAL_SERVICE_KEY: ${CASTREL_INTERNAL_SERVICE_KEY:?CASTREL_INTERNAL_SERVICE_KEY must be set}
      TRAFFIC_LIFECYCLE_ACCOUNTS: ${TRAFFIC_LIFECYCLE_ACCOUNTS:-[]}
      TRAFFIC_EXERCISE_ACCOUNTS: '${TRAFFIC_EXERCISE_ACCOUNTS:-[{"label":"sam","email":"sam@example.com","password":"password","expectedCustomerId":19}]}'
      CONTROL_PLANE_USERNAME: ${CONTROL_PLANE_USERNAME:-castrel}
      CONTROL_PLANE_PASSWORD: ${CONTROL_PLANE_PASSWORD:-C@stre1_best_ai}
      CONTROL_PLANE_SESSION_SECRET: ${CONTROL_PLANE_SESSION_SECRET:-${CASTREL_JWT_SECRET:?CONTROL_PLANE_SESSION_SECRET or CASTREL_JWT_SECRET must be set}}
      CONTROL_PLANE_COOKIE_SECURE: ${CONTROL_PLANE_COOKIE_SECURE:-false}
      OPERATOR_ID: ${OPERATOR_ID:-3}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-castrel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-castrel}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-castrel}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ALERT_CONFIG_DIR: /app/alert-data
      ALERT_SOURCE_RULES_PATH: /app/infra-source/prometheus-rules/alert-rules.yml
      ALERT_SOURCE_MANAGER_PATH: /app/infra-source/alertmanager/alertmanager.yml
      PROMETHEUS_RELOAD_URL: http://prometheus:9090/-/reload
      ALERTMANAGER_RELOAD_URL: http://alertmanager:9093/-/reload
      GRAFANA_BASE_URL: ${CHAOS_CONSOLE_GRAFANA_BASE_URL:-http://localhost:13000}
    depends_on:
      gateway-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3086/"]
      <<: *healthcheck-defaults

  traffic-control-plane-worker:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/traffic-control-plane:${IMAGE_TAG:-latest}
    build:
      context: ./traffic-control-plane
      dockerfile: Dockerfile
    container_name: castrel-traffic-control-plane-worker
    <<: *service-defaults
    command: ["pnpm", "worker"]
    volumes:
      - ./data/traffic-control-plane-worker:/app/data
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      GATEWAY_BASE_URL: http://gateway-service:8080
      CASTREL_INTERNAL_SERVICE_KEY: ${CASTREL_INTERNAL_SERVICE_KEY:?CASTREL_INTERNAL_SERVICE_KEY must be set}
      TRAFFIC_LIFECYCLE_ACCOUNTS: ${TRAFFIC_LIFECYCLE_ACCOUNTS:-[]}
      TRAFFIC_EXERCISE_ACCOUNTS: '${TRAFFIC_EXERCISE_ACCOUNTS:-[{"label":"sam","email":"sam@example.com","password":"password","expectedCustomerId":19}]}'
      CONTROL_PLANE_USERNAME: ${CONTROL_PLANE_USERNAME:-castrel}
      CONTROL_PLANE_PASSWORD: ${CONTROL_PLANE_PASSWORD:-C@stre1_best_ai}
      CONTROL_PLANE_SESSION_SECRET: ${CONTROL_PLANE_SESSION_SECRET:-${CASTREL_JWT_SECRET:?CONTROL_PLANE_SESSION_SECRET or CASTREL_JWT_SECRET must be set}}
      CONTROL_PLANE_COOKIE_SECURE: ${CONTROL_PLANE_COOKIE_SECURE:-false}
      OPERATOR_ID: ${OPERATOR_ID:-3}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-castrel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-castrel}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-castrel}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GRAFANA_BASE_URL: ${CHAOS_CONSOLE_GRAFANA_BASE_URL:-http://localhost:13000}
    depends_on:
      gateway-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  shopfront:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/shopfront:${IMAGE_TAG:-latest}
    build:
      context: ./shopfront
      dockerfile: Dockerfile
    container_name: castrel-shopfront
    <<: *service-defaults
    ports:
      - "13090:3090"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3090
      GATEWAY_BASE_URL: http://gateway-service:8080
      SHOPFRONT_COOKIE_SECURE: ${SHOPFRONT_COOKIE_SECURE:-false}
      SHOPFRONT_ACCESS_TOKEN: ${SHOPFRONT_ACCESS_TOKEN:-}
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3090/"]
      <<: *healthcheck-defaults

  promotion-service:
    image: ${REGISTRY:-harbor.cloudwise.com/noname}/promotion-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: promotion-service/Dockerfile
    container_name: castrel-promotion
    <<: *service-defaults
    volumes:
      - ./data/promotion-service:/service-data
    environment:
      <<: *java-service-env
      OTEL_SERVICE_NAME: promotion-service
      SW_AGENT_NAME: promotion-service
      CW_APP_NAME: ${PROMOTION_CW_APP_NAME:-promotion-service}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/actuator/health"]
      <<: *healthcheck-defaults

  risk-service:
