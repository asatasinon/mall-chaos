server:
  port: 8083

spring:
  application:
    name: inventory-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13306/castrel?useSSL=false&serverTimezone=Asia/Shanghai&connectionTimeZone=+08:00&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:castrel}
    password: ${SPRING_DATASOURCE_PASSWORD:castrel}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:16379}

inventory:
  demo-baseline:
    enabled: ${INVENTORY_DEMO_BASELINE_ENABLED:true}
    skus: ${INVENTORY_DEMO_BASELINE_SKUS:SKU-001,SKU-002}
    target-available-qty: ${INVENTORY_DEMO_BASELINE_TARGET_AVAILABLE_QTY:100}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,schemaVersion
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
