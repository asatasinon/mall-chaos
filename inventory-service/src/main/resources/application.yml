server:
  port: 8083

spring:
  application:
    name: inventory-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13306/castrel?useSSL=false&serverTimezone=Asia/Shanghai&connectionTimeZone=%2B08:00&allowPublicKeyRetrieval=true&connectTimeout=60000&socketTimeout=60000}
    username: ${SPRING_DATASOURCE_USERNAME:castrel}
    password: ${SPRING_DATASOURCE_PASSWORD:castrel}
    hikari:
      connection-timeout: 60000
  jdbc:
    template:
      query-timeout: 60s
  jpa:
    properties:
      hibernate.jdbc.timeout: 60
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:16379}

inventory:
  demo-baseline:
    enabled: ${INVENTORY_DEMO_BASELINE_ENABLED:true}
    skus: ${INVENTORY_DEMO_BASELINE_SKUS:SKU-001,SKU-002,SKU-003,SKU-004,SKU-005,SKU-006,SKU-007,SKU-008,SKU-009,SKU-010,SKU-011,SKU-012,SKU-013,SKU-014,SKU-015,SKU-016,SKU-017,SKU-018,SKU-019,SKU-020,SKU-021,SKU-022,SKU-023,SKU-024,SKU-025,SKU-026,SKU-027,SKU-028,SKU-029,SKU-030,SKU-031,SKU-032,SKU-033,SKU-034,SKU-035,SKU-036,SKU-037,SKU-038,SKU-039,SKU-040,SKU-041,SKU-042,SKU-043,SKU-044,SKU-045,SKU-046,SKU-047,SKU-048,SKU-049,SKU-050}
    target-available-qty: ${INVENTORY_DEMO_BASELINE_TARGET_AVAILABLE_QTY:1000000}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
